<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تاسوجە</title>
<style>body{margin:0;font-family:Tahoma;background:#f4f7f5}header{padding:18px;text-align:center;background:#16834a;color:#fff;font-size:22px;font-weight:800}main{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;text-align:center}button{width:100%;padding:14px;border:0;border-radius:12px;background:#16834a;color:#fff;font-weight:700}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:7px 0}</style>
</head>
<body>
<header onclick="t++ ; if(t>=5){p=prompt('وشەی نهێنی'); if(p=='1234') alert('ئەدمین کرایەوە')}}">تاسوجە دلیڤەری</header>
<main id="app"></main>
<script>
let t=0;
function login(){document.getElementById('app').innerHTML=`<div class="card"><h2>تاسوجە 🛵</h2><input id="ph" placeholder="0770..."><button onclick="showCode()">ناردنی کۆد</button><div id="c" style="display:none"><input id="cd" placeholder="123456"><button onclick="go()">چوونە ژوورەوە</button></div></div>`}
function showCode(){document.getElementById('c').style.display='block';alert('کۆدەکە: 123456')}
function go(){if(document.getElementById('cd').value=='123456'){home()}else{alert('کۆد هەڵەیە')}}
function home(){document.getElementById('app').innerHTML=`<div class="card" onclick="alert('تەکسی')"><div style="font-size:40px">🚕</div><b>تەکسی تاسوجە</b></div><div class="card" onclick="alert('خواردەمەنی')"><div style="font-size:40px">🍔</div><b>خواردەمەنی</b></div><div class="card" onclick="alert('دووکانەکان')"><div style="font-size:40px">🛒</div><b>دووکانەکانی تر</b></div><button onclick="login()">دەرچوون</button>`}
login();
</script>
</body>
</html>
