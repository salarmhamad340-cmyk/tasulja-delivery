<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تاسوجە دلیڤەری</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,sans-serif;background:#f4f7f5;direction:rtl}
header{padding:18px;text-align:center;background:linear-gradient(135deg,#16834a,#0d6338);color:#fff;font-size:22px;font-weight:800}
main{max-width:560px;margin:auto;padding:14px 13px 100px}
.card{background:#fff;border-radius:19px;padding:17px;margin-bottom:14px;box-shadow:0 5px 20px rgba(0,0,0,.07)}
button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:13px;background:#16834a;color:#fff;font-weight:700;font-size:15px}
button.sec{background:#64736a} button.blue{background:#2879bd} button.danger{background:#d94343} button.orange{background:#e99a25;color:#222}
button.smallBtn{width:auto;display:inline-block;padding:9px 12px;font-size:12px;margin:3px}
input{width:100%;padding:14px;margin:7px 0;border:1px solid #dbe4de;border-radius:13px;font-size:16px}
.shop-img{width:100%;height:175px;object-fit:cover;border-radius:15px}
.role-card{padding:28px 18px;text-align:center;cursor:pointer;border:2px solid #eaf7ef}
.badge{display:inline-block;padding:5px 11px;border-radius:20px;font-size:11px;background:#e5f6eb;color:#16834a}
.file-label{display:block;padding:14px;text-align:center;background:#eaf7ef;border:2px dashed #16834a;border-radius:13px;cursor:pointer;font-weight:700;color:#10663a;margin:7px 0}
.file-label input{display:none} .preview-img{width:100%;height:160px;object-fit:cover;border-radius:13px;display:none;margin:7px 0}
/* پەیامی پڕۆفیشناڵ لەجیاتی alert */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:13px 20px;border-radius:30px;font-size:14px;z-index:999;display:none;box-shadow:0 5px 20px #0005;max-width:90%;text-align:center}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:998;display:none;align-items:flex-end;justify-content:center}
#modalBox{background:#fff;width:100%;max-width:560px;border-radius:25px 25px 0 0;padding:20px;padding-bottom:30px}
</style>
</head>
<body>
<header>تاسوجە دلیڤەری</header>
<main id="app"></main>
<div id="toast"></div>
<div id="modalBg"><div id="modalBox"></div></div>
<script>
let shops = JSON.parse(localStorage.getItem('tasuje_shops')||'[]');
let products = JSON.parse(localStorage.getItem('tasuje_products')||'[]');
let orders = JSON.parse(localStorage.getItem('tasuje_orders')||'[]');
let cart=[], currentShop=null, _sImg="", _pImg="";
let userPhone = localStorage.getItem('tasuje_phone')||"";
let deliveryName = localStorage.getItem('tasuje_delivery')||"";
function save(){ localStorage.setItem('tasuje_shops',JSON.stringify(shops)); localStorage.setItem('tasuje_products',JSON.stringify(products)); localStorage.setItem('tasuje_orders',JSON.stringify(orders)); }
function fileToBase64(f,cb){ const r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(f); }

// لەجیاتی alert - پەیامی جوان لە ناو بەرنامەکە
function toast(msg){ let t=document.getElementById('toast'); t.innerText=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); }
// لەجیاتی prompt - بۆکسێکی جوان لە خوارەوە
function ask(title, placeholder, cb){
  let bg=document.getElementById('modalBg'); let box=document.getElementById('modalBox');
  box.innerHTML=`<h3 style="margin:0 0 10px">${title}</h3><input id="modalInput" placeholder="${placeholder}"><button onclick="submitModal()">باشە</button><button class="sec" onclick="closeModal()">پاشگەزبوونەوە</button>`;
  bg.style.display='flex'; window._askCb=cb; setTimeout(()=>document.getElementById('modalInput').focus(),100);
}
function submitModal(){ let v=document.getElementById('modalInput').value; closeModal(); if(window._askCb) window._askCb(v); }
function closeModal(){ document.getElementById('modalBg').style.display='none'; }
function confirmBox(title, cb){
  let bg=document.getElementById('modalBg'); let box=document.getElementById('modalBox');
  box.innerHTML=`<h3>${title}</h3><button class="danger" onclick="closeModal();window._askCb(true)">بەڵێ، بسڕەوە</button><button class="sec" onclick="closeModal()">نەخێر</button>`;
  bg.style.display='flex'; window._askCb=cb;
}

function showLogin(){
  document.getElementById('app').innerHTML = `
  <div class="card" style="text-align:center"><div style="font-size:50px">🛵</div><h2>تاسوجە دلیڤەری</h2><p style="color:#666">ژمارە مۆبایلەکەت بنووسە</p></div>
  <div class="card"><input id="phoneInput" placeholder="0770..." value="${userPhone}">
  <button onclick="sendSMS()">📩 ناردنی کۆد بە SMS</button>
  <div id="codeBox" style="display:none"><input id="codeInput" placeholder="کۆدی SMS - 123456"><button class="blue" onclick="verifyCode()">پشتڕاستکردنەوە</button></div></div>`;
}
function sendSMS(){ let p=document.getElementById('phoneInput').value; if(!p) return toast('تکایە ژمارە بنووسە'); userPhone=p; localStorage.setItem('tasuje_phone',p); document.getElementById('codeBox').style.display='block'; toast('کۆد نێردرا ✅'); }
function verifyCode(){ if(document.getElementById('codeInput').value=='123456'){ localStorage.setItem('tasuje_logged','yes'); home(); toast('بەخێربێیت 👋'); } else toast('کۆدەکە هەڵەیە'); }

function home(){
  if(!localStorage.getItem('tasuje_logged')) return showLogin();
  document.getElementById('app').innerHTML = `
  <div class="card" style="text-align:center"><h2>بەخێربێیت بۆ تاسوجە دلیڤەری 👋</h2><p style="color:#666">ژمارەکەت: ${userPhone}</p></div>
  <div class="card role-card" onclick="showShops()"><div style="font-size:40px">🛒</div><b>کڕیار</b><p>دووکانەکان ببینە و داوا بکە</p></div>
  <div class="card role-card" onclick="enterAdmin()"><div style="font-size:40px">👑</div><b>ئەدمین</b><p>دووکان و نرخ بەڕێوەببە</p></div>
  <div class="card role-card" onclick="enterDelivery()"><div style="font-size:40px">🛵</div><b>دلیڤەری</b><p>تەڵەب قبوڵ بکە</p></div>
  <button class="sec" onclick="localStorage.removeItem('tasuje_logged');showLogin()">دەرچوون</button>`;
}
function showShops(){
  let html=`<button class="sec" onclick="home()">← گەڕانەوە</button><div class="card"><h3>دووکانەکان</h3></div>`;
  if(!shops.length) html+=`<div class="card">هیچ دووکانێک نییە، بچۆ بەشی ئەدمین</div>`;
  shops.forEach((s,i)=>{ html+=`<div class="card" onclick="openShop(${i})" style="cursor:pointer">${s.image?`<img class="shop-img" src="${s.image}">`:''}<div style="display:flex;justify-content:space-between;margin-top:10px"><b>${s.name}</b><span class="badge">${s.open?'🟢 کراوەیە':'🔴 داخراوە'}</span></div><div style="color:#888;font-size:12px">📍 ${s.location} · ⭐ 0.0 · گەیاندن 1,000</div></div>`; });
  document.getElementById('app').innerHTML=html;
}
function openShop(idx){
  let s=shops[idx]; currentShop=idx;
  document.getElementById('app').innerHTML=`
  <div style="margin:-14px -13px 0;position:relative"><img src="${s.image||''}" style="width:100%;height:230px;object-fit:cover"><div style="position:absolute;bottom:0;left:0;right:0;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff"><h2 style="margin:0">${s.name}</h2><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="badge" style="background:#000a;color:#fff">⭐ 0.0</span><span class="badge" style="background:${s.open?'#2e7d32':'#c62828'};color:#fff">${s.open?'ئێستا کراوەیە':'داخراوە'}</span><span class="badge" style="background:#000a;color:#fff">📍 ${s.location}</span></div></div></div>
  <button class="sec" onclick="showShops()">گەڕانەوە</button><div id="items" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px"></div><div id="cartBar"></div>`;
  let h=''; products.forEach((p,pi)=>{ if(p.shopId!=idx) return; h+=`<div style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001;position:relative">${!p.available?'<span style="position:absolute;top:38px;right:6px;background:#c62828;color:#fff;padding:4px 8px;border-radius:10px;font-size:11px">بەردەست نییە</span>':''}<img src="${p.image||''}" style="width:100%;height:110px;object-fit:cover"><div style="background:#111;color:#f5c542;padding:6px;text-align:center;font-weight:bold;font-size:13px">${p.price} / کیلۆگرام</div><div style="background:#e9b32b;padding:8px;text-align:center;font-weight:bold;font-size:13px">${p.name}</div><button class="smallBtn" style="width:100%;margin:0;border-radius:0" onclick="addToCart(${pi},'${p.name}',${p.price})" ${!p.available?'disabled':''}>+ زیاد بکە</button></div>`; });
  document.getElementById('items').innerHTML=h||'<p>هیچ بەرهەمێک نییە</p>'; updateCartBar();
}
function addToCart(id,name,price){ let f=cart.find(c=>c.id==id); if(f) f.qty++; else cart.push({id,name,price,qty:1}); updateCartBar(); toast(name+' زیادکرا'); }
function updateCartBar(){ let total=cart.reduce((a,c)=>a+c.price*c.qty,0); let count=cart.reduce((a,c)=>a+c.qty,0); let el=document.getElementById('cartBar'); if(el) el.innerHTML = count? `<div style="position:fixed;bottom:0;left:0;right:0;background:#16834a;color:#fff;padding:16px;text-align:center;font-weight:800;cursor:pointer" onclick="checkout()">🛒 ${count} دانە · ${total+1000} · کلیک بکە</div>` : ''; }
function checkout(){
  ask('ناوت چییە؟','ناوەکەت بنووسە', (name)=>{ if(!name) return; ask('ناونیشان؟','بۆ نموونە: شۆڕش، کۆڵانی...', (addr)=>{ if(!addr) return; let total=cart.reduce((a,c)=>a+c.price*c.qty,0)+1000; orders.push({shopName:shops[currentShop].name, items:cart, total, customerName:name, phone:userPhone, address:addr, status:'pending', deliveryName:'', created:Date.now()}); save(); cart=[]; toast('✅ داواکەت نێردرا!'); showShops(); }); });
}
function enterAdmin(){ ask('وشەی نهێنی ئەدمین','1234',(p)=>{ if(p!=='1234') return toast('وشەی نهێنی هەڵەیە'); showAdmin(); }); }
function showAdmin(){
  let html=`<button class="sec" onclick="home()">← سەرەتا</button><div class="card"><h3>👑 ئەدمین - تاسوجە</h3><button onclick="addShopForm()">+ دووکانی نوێ</button><button class="blue" onclick="showAdminOrders()">📦 تەڵەبەکان ببینە</button></div>`;
  shops.forEach((s,i)=>{ html+=`<div class="card">${s.image?`<img class="shop-img" src="${s.image}">`:''}<b>${s.name}</b><div style="color:#888;font-size:12px">📍 ${s.location}</div><button class="smallBtn orange" onclick="manageProducts(${i},'${s.name}')">بەرهەم و نرخ</button><button class="smallBtn" onclick="shops[${i}].open=!shops[${i}].open;save();showAdmin()">کردنەوە / داخستن</button><button class="smallBtn danger" onclick="confirmBox('دڵنیایت لە سڕینەوەی ${s.name}؟', (ok)=>{ if(ok){shops.splice(${i},1);save();showAdmin(); toast('سڕایەوە');} })">سڕینەوە</button></div>`; });
  document.getElementById('app').innerHTML=html;
}
function addShopForm(){ _sImg=""; document.getElementById('app').innerHTML=`<div class="card"><h3>دووکانی نوێ</h3><input id="shopName" placeholder="ناوی دووکان"><input id="shopLoc" placeholder="شوێن" value="شۆڕش"><label class="file-label">📷 وێنەی دووکان<input type="file" accept="image/*" onchange="fileToBase64(this.files[0],v=>{_sImg=v;document.getElementById('sPrev').src=v;document.getElementById('sPrev').style.display='block'})"></label><img id="sPrev" class="preview-img"><button onclick="saveShop()">پاشەکەوت</button><button class="sec" onclick="showAdmin()">گەڕانەوە</button></div>`; }
function saveShop(){ let n=document.getElementById('shopName').value; if(!n||!_sImg) return toast('ناو و وێنە پێویستە'); shops.push({name:n,location:document.getElementById('shopLoc').value,image:_sImg,open:true}); save(); showAdmin(); toast('دووکان دروستکرا ✅'); }
function manageProducts(shopId,shopName){
  let html=`<button class="sec" onclick="showAdmin()">← ئەدمین</button><div class="card"><h3>${shopName}</h3><button onclick="addProductForm(${shopId})">+ بەرهەمی نوێ</button></div>`;
  products.forEach((p,idx)=>{ if(p.shopId!=shopId) return; html+=`<div class="card"><div style="display:flex;gap:10px"><img src="${p.image||''}" style="width:70px;height:70px;object-fit:cover;border-radius:10px"><div><b>${p.name}</b><div>نرخ: <b>${p.price}</b> / کیلۆگرام</div><div>${p.available?'✅ بەردەستە':'❌ بەردەست نییە'}</div></div></div><button class="smallBtn orange" onclick="ask('نرخی نوێ','نرخ بنووسە', (np)=>{ if(np){ products[${idx}].price=Number(np); save(); showAdmin(); toast('نرخ گۆڕدرا ✅'); } })">💰 گۆڕینی نرخ</button><button class="smallBtn" onclick="products[${idx}].available=!products[${idx}].available;save();manageProducts(${shopId},'${shopName}')">بەردەست / نەماوە</button><button class="smallBtn danger" onclick="confirmBox('بسڕمەوە؟', (ok)=>{ if(ok){products.splice(${idx},1);save();manageProducts(${shopId},'${shopName}');} })">سڕینەوە</button></div>`; });
  document.getElementById('app').innerHTML=html;
}
function addProductForm(shopId){ _pImg=""; document.getElementById('app').innerHTML=`<div class="card"><h3>بەرهەمی نوێ</h3><input id="pName" placeholder="ناوی بەرهەم"><input id="pPrice" type="number" placeholder="نرخ بە کیلۆگرام"><label class="file-label">📷 وێنەی بەرهەم<input type="file" accept="image/*" onchange="fileToBase64(this.files[0],v=>{_pImg=v;document.getElementById('pPrev').src=v;document.getElementById('pPrev').style.display='block'})"></label><img id="pPrev" class="preview-img"><button onclick="saveProduct(${shopId})">پاشەکەوت</button><button class="sec" onclick="showAdmin()">گەڕانەوە</button></div>`; }
function saveProduct(shopId){ let n=document.getElementById('pName').value; if(!n||!_pImg) return toast('ناو و وێنە پێویستە'); products.push({shopId,name:n,price:Number(document.getElementById('pPrice').value),available:true,image:_pImg}); save(); showAdmin(); toast('بەرهەم زیادکرا ✅'); }
function showAdminOrders(){
  let html=`<button class="sec" onclick="showAdmin()">← ئەدمین</button><h3>📦 هەموو تەڵەبەکان</h3>`;
  if(!orders.length) html+='<div class="card">هیچ تەڵەبێک نییە</div>';
  orders.forEach(o=>{ html+=`<div class="card"><b>${o.shopName}</b> · ${o.status=='pending'?'🟡 چاوەڕوانە':o.status=='accepted'?'🟢 قبوڵکراوە لەلایەن '+o.deliveryName:'✅ گەیشت'}<br>کڕیار: ${o.customerName} · ${o.phone}<br>ناونیشان: ${o.address}<br>بەرهەم: ${o.items.map(i=>i.name+' x'+i.qty).join(', ')}<br><b>کۆی: ${o.total}</b></div>`; });
  document.getElementById('app').innerHTML=html;
}
function enterDelivery(){ if(!deliveryName){ ask('ناوی دلیڤەری','ناوەکەت بنووسە', (n)=>{ if(!n) return; deliveryName=n; localStorage.setItem('tasuje_delivery',n); showDelivery(); }); } else showDelivery(); }
function showDelivery(){
  let html=`<button class="sec" onclick="home()">← سەرەتا</button><div class="card"><h3>🛵 تەڵەبەکان - ${deliveryName}</h3></div>`; let has=false;
  orders.forEach((o,idx)=>{ if(o.status=='pending'){ has=true; html+=`<div class="card"><b>${o.shopName}</b><br>کڕیار: ${o.customerName} · ${o.phone}<br>📍 ${o.address}<br>بەرهەم: ${o.items.map(i=>i
